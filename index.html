<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#20242c" />
    <title>공 굴리기 게임</title>
    <meta name="description" content="이름을 넣고 구슬을 굴려 당첨자를 뽑는 3D 구슬 경주 추첨" />
  </head>
  <body>
    <canvas id="view" aria-label="구슬 경주 화면"></canvas>
    <div id="labels" aria-hidden="true"></div>
    <canvas id="minimap" aria-hidden="true"></canvas>

    <ol id="rank" aria-label="순위"></ol>
    <div id="banner" role="status" aria-live="polite" hidden></div>
    <div id="fast" aria-live="polite" hidden>2배속</div>
    <div id="tap-hint" hidden>화면을 누르면 2배속</div>

    <form id="panel" autocomplete="off">
      <h1>공 굴리기 게임</h1>
      <label for="names">이름 <small>쉼표로 구분 · <code>이름*2</code> 구슬 2개 · <code>이름/3</code> 무게 3배</small></label>
      <textarea id="names" rows="3" spellcheck="false"></textarea>
      <p id="count" class="hint"></p>

      <div class="row">
        <fieldset>
          <legend>당첨 기준</legend>
          <label><input type="radio" name="win" value="first" checked /> 1등</label>
          <label><input type="radio" name="win" value="last" /> 꼴찌</label>
        </fieldset>
        <label>당첨 수 <input id="winners" type="number" min="1" max="30" value="1" inputmode="numeric" /></label>
      </div>
      <div class="row">
        <button id="shuffle" type="button">셔플</button>
        <button id="start" type="submit" class="primary" disabled>불러오는 중…</button>
      </div>
      <div class="row small">
        <span>시드 <code id="seed"></code></span>
        <button id="share" type="button">링크 복사</button>
      </div>
      <p id="message" class="hint" role="alert"></p>
    </form>

    <div id="hud" hidden>
      <label
        >배속
        <select id="speed">
          <option value="1" selected>1x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
          <option value="3">3x</option>
        </select>
      </label>
      <button id="pause" type="button" aria-pressed="false">⏸ 일시정지</button>
      <button id="stop" type="button">■ 종료</button>
      <button id="again" type="button" hidden>다시 하기</button>
    </div>


    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
