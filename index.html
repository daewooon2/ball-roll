<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#20242c" />
    <title>공 굴리기 게임 - 구슬 추첨기 · 핀볼 뽑기 · 점심 내기 (무료)</title>
    <meta name="description" content="공 굴리기 게임은 이름을 넣고 구슬(공)을 굴려 당첨자를 뽑는 무료 3D 추첨기입니다. 공 떨어지는 핀볼처럼 구멍 함정과 회전 막대를 지나 1등(또는 꼴찌)이 정해져요. 점심 내기 게임, 커피 내기, 발표 순서, 이벤트 당첨자 뽑기에. 설치·가입 없이 폰에서 바로." />
    <meta name="keywords" content="공 굴리기 게임, 공 굴리기 뽑기, 공 굴리기 룰렛, 구슬 추첨기, 구슬 추첨 게임, 핀볼 추첨, 공 떨어지는 추첨 게임, 점심 내기 게임, 당첨자 뽑기, 랜덤 뽑기, 제비뽑기 사이트, 룰렛 추첨" />
    <link rel="canonical" href="https://daewooon2.github.io/ball-roll/" />
    <!-- 카카오톡·SNS 링크 미리보기 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="공 굴리기 게임" />
    <meta property="og:title" content="공 굴리기 게임 - 구슬 굴려 뽑는 무료 추첨기" />
    <meta property="og:description" content="이름 넣고 시작! 공이 핀볼처럼 굴러 떨어져 당첨자가 정해져요. 점심 내기, 발표 순서, 당첨자 뽑기에." />
    <meta property="og:url" content="https://daewooon2.github.io/ball-roll/" />
    <meta property="og:image" content="https://daewooon2.github.io/ball-roll/og.jpg" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="450" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"WebApplication","name":"공 굴리기 게임","url":"https://daewooon2.github.io/ball-roll/","applicationCategory":"GameApplication","operatingSystem":"Any","inLanguage":"ko","description":"이름을 넣고 3D 구슬을 굴려 당첨자를 뽑는 무료 온라인 추첨 게임","offers":{"@type":"Offer","price":"0","priceCurrency":"KRW"}}
    </script>
  </head>
  <body>
    <canvas id="view" aria-label="구슬 경주 화면"></canvas>
    <div id="labels" aria-hidden="true"></div>
    <canvas id="minimap" aria-hidden="true"></canvas>

    <ol id="rank" aria-label="순위"></ol>
    <div id="banner" role="status" aria-live="polite" hidden></div>
    <div id="fast" aria-live="polite" hidden>2배속</div>
    <div id="tap-hint" hidden>화면을 누르면 2배속</div>

    <form id="panel" autocomplete="off">
      <h1>공 굴리기 게임</h1>
      <label for="names">이름 <small>쉼표로 구분 · <code>이름*2</code> 구슬 2개 · <code>이름/3</code> 무게 3배</small></label>
      <textarea id="names" rows="3" spellcheck="false"></textarea>
      <p id="count" class="hint"></p>

      <div class="row">
        <fieldset>
          <legend>당첨 기준</legend>
          <label><input type="radio" name="win" value="first" checked /> 1등</label>
          <label><input type="radio" name="win" value="last" /> 꼴찌</label>
        </fieldset>
        <label>당첨 수 <input id="winners" type="number" min="1" max="30" value="1" inputmode="numeric" /></label>
      </div>
      <div class="row">
        <button id="shuffle" type="button">셔플</button>
        <button id="start" type="submit" class="primary" disabled>불러오는 중…</button>
      </div>
      <div class="row small">
        <span>시드 <code id="seed"></code></span>
        <button id="share" type="button">링크 복사</button>
      </div>
      <p id="message" class="hint" role="alert"></p>
      <p class="hint about">공 굴리기 게임은 이름을 넣고 공을 굴려 뽑는 무료 구슬 추첨기예요. 공이 핀볼처럼 떨어지다 구멍 함정과 회전 막대를 지나 당첨자가 정해져요. 점심·커피 내기, 발표 순서, 당첨자 뽑기에 쓰세요. 설치나 가입은 필요 없어요.</p>
      <p class="hint links"><a href="guide.html">사용법·자주 묻는 질문</a> · <a href="privacy.html">개인정보처리방침</a></p>
    </form>

    <div id="hud" hidden>
      <label
        >배속
        <select id="speed">
          <option value="1" selected>1x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
          <option value="3">3x</option>
        </select>
      </label>
      <button id="pause" type="button" aria-pressed="false">⏸ 일시정지</button>
      <button id="stop" type="button">■ 종료</button>
      <button id="again" type="button" hidden>다시 하기</button>
    </div>


    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
